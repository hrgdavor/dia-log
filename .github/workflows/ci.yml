name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # -Dgpg.skip=true: artifact signing is only done by the release workflow
      # (publish.yml); verify would otherwise fail without GPG keys.
      - name: Build, test, and collect coverage
        run: mvn -B clean verify -Dgpg.skip=true

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            logback/target/site/jacoco
          if-no-files-found: ignore
